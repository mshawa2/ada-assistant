<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ada</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #14151a;
    --panel: #1c1e26;
    --panel-border: #2a2d38;
    --text: #e8e9ee;
    --muted: #8a8d9c;
    --accent: #7c9eff;
    --urgent: #ff6b6b;
    --critical: #ff3b3b;
    --normal: #6b7280;
    --good: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 2rem;
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 0.25rem 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }

  .status-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.5rem; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--good);
    transition: background 0.2s;
  }
  .dot.busy { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  #status-text { font-size: 0.95rem; }

  .banner {
    background: #3a2a12;
    border: 1px solid #6b4a1a;
    color: #ffcf8a;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
    display: none;
  }
  .banner.show { display: block; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    margin-bottom: 1.2rem;
  }
  .panel h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 0.8rem 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .heartbeat-toggle {
    background: var(--panel-border);
    color: var(--text);
    border: none;
    border-radius: 6px;
    padding: 0.3rem 0.7rem;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .heartbeat-toggle:hover { background: var(--accent); color: #fff; }

  .notice {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 0.88rem;
  }
  .notice:last-child { border-bottom: none; }
  .notice .badge {
    font-size: 0.65rem;
    text-transform: uppercase;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 0.1rem;
  }
  .badge.normal { background: var(--normal); }
  .badge.urgent { background: var(--urgent); color: #2a0000; }
  .badge.critical { background: var(--critical); color: #fff; }
  .notice .text { flex: 1; }
  .notice button {
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--muted);
    border-radius: 5px;
    padding: 0.15rem 0.5rem;
    cursor: pointer;
    font-size: 0.75rem;
  }
  .notice button:hover { border-color: var(--accent); color: var(--accent); }

  .empty { color: var(--muted); font-size: 0.85rem; font-style: italic; }

  .activity-item {
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 0.82rem;
    color: var(--muted);
    font-family: ui-monospace, monospace;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-item .event-type { color: var(--accent); }
</style>
</head>
<body>
  <h1>🪄 Ada</h1>
  <div class="subtitle">local dashboard — glance, don't grep</div>

  <div class="status-row">
    <div class="dot" id="status-dot"></div>
    <div id="status-text">idle</div>
  </div>

  <div class="banner" id="pending-banner"></div>

  <div class="panel">
    <h2>
      Heartbeat
      <button class="heartbeat-toggle" id="heartbeat-toggle">…</button>
    </h2>
    <div id="heartbeat-state" class="empty">checking…</div>
  </div>

  <div class="panel">
    <h2>Notices</h2>
    <div id="notices"><div class="empty">Loading…</div></div>
  </div>

  <div class="panel">
    <h2>Recent activity</h2>
    <div id="activity"><div class="empty">Loading…</div></div>
  </div>

<script>
async function refreshStatus() {
  const r = await fetch('/api/status');
  const data = await r.json();
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  text.textContent = data.status;
  dot.className = 'dot' + (data.status !== 'idle' ? ' busy' : '');

  const banner = document.getElementById('pending-banner');
  if (data.pending_confirmation) {
    banner.textContent = '⏳ Waiting for you to answer in the terminal: ' + data.pending_confirmation;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

async function refreshHeartbeat() {
  const r = await fetch('/api/heartbeat');
  const data = await r.json();
  const stateEl = document.getElementById('heartbeat-state');
  const toggle = document.getElementById('heartbeat-toggle');
  stateEl.textContent = data.paused ? 'Paused — background checks are not running.' : 'Running normally.';
  stateEl.className = data.paused ? '' : 'empty';
  toggle.textContent = data.paused ? 'Resume' : 'Pause';
  toggle.onclick = async () => {
    await fetch(data.paused ? '/api/heartbeat/resume' : '/api/heartbeat/pause', { method: 'POST' });
    refreshHeartbeat();
  };
}

async function refreshNotices() {
  const r = await fetch('/api/notices');
  const notices = await r.json();
  const el = document.getElementById('notices');
  if (!notices.length) {
    el.innerHTML = '<div class="empty">Nothing noticed right now.</div>';
    return;
  }
  el.innerHTML = notices.map(n => `
    <div class="notice">
      <span class="badge ${n.level}">${n.level}</span>
      <span class="text">${escapeHtml(n.text)}</span>
      <button data-id="${n.id}">dismiss</button>
    </div>
  `).join('');
  el.querySelectorAll('button[data-id]').forEach(btn => {
    btn.onclick = async () => {
      await fetch(`/api/notices/${btn.dataset.id}/dismiss`, { method: 'POST' });
      refreshNotices();
    };
  });
}

async function refreshActivity() {
  const r = await fetch('/api/activity');
  const entries = await r.json();
  const el = document.getElementById('activity');
  if (!entries.length) {
    el.innerHTML = '<div class="empty">No activity logged yet.</div>';
    return;
  }
  el.innerHTML = entries.map(e => {
    const time = new Date(e.time * 1000).toLocaleTimeString();
    const detail = summarize(e);
    return `<div class="activity-item">${time} — <span class="event-type">${e.event}</span> ${escapeHtml(detail)}</div>`;
  }).join('');
}

function summarize(e) {
  if (e.event === 'tool_call') return e.tool + (e.error ? ` (error: ${e.error})` : '');
  if (e.event === 'confirmation_requested') return `${e.tool} — ${e.approved ? 'approved' : 'declined'}`;
  if (e.event === 'heartbeat_notice') return `[${e.level}] ${e.text}`;
  if (e.event === 'model_call') return `${e.input_tokens} in / ${e.output_tokens} out`;
  return '';
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}

function refreshAll() {
  refreshStatus();
  refreshHeartbeat();
  refreshNotices();
  refreshActivity();
}

refreshAll();
setInterval(refreshAll, 1500);
</script>
</body>
</html>
